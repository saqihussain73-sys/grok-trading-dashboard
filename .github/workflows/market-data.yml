name: Update public market data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh indicative public quotes
        run: python scripts/update_market_data.py
      - name: Commit sanitized status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public indicative market quotes"
            git push
          fi
